<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業者検索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>業者検索</h1>
    <span id="modeBadge" class="badge" hidden>デモデータ表示中</span>
    <div class="user-box" id="userBox" hidden>
      <span id="userName"></span>
      <form method="post" action="/auth/logout" id="logoutForm"><button type="submit" class="btn small">ログアウト</button></form>
    </div>
  </header>

  <section class="login-view" id="loginView" hidden>
    <div class="login-card">
      <h2>業者検索</h2>
      <p>Salesforce のアカウントでログインしてください。</p>
      <p class="form-error" id="loginError"></p>
      <a class="btn primary large" href="/auth/login">Salesforce でログイン</a>
    </div>
  </section>

  <main class="layout" id="appView" hidden>
    <section class="panel search-panel" aria-label="検索">
      <form id="searchForm" class="search-form">
        <label class="field grow">
          <span>キーワード（発注先名・コード）</span>
          <input type="search" name="keyword" placeholder="例：印刷、V-0001">
        </label>
        <label class="field">
          <span>ファミリ</span>
          <select name="family"><option value="">すべて</option></select>
        </label>
        <label class="field">
          <span>評価</span>
          <select name="minRating">
            <option value="">すべて</option>
            <option value="3">★3以上</option>
            <option value="4">★4以上</option>
            <option value="4.5">★4.5以上</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" name="activeOnly" checked> 有効な発注先のみ
        </label>
        <button type="submit" class="btn primary">検索</button>
      </form>

      <div class="result-head">
        <span id="resultCount"></span>
        <span class="muted" id="fyNote"></span>
      </div>
      <div class="table-wrap">
        <table class="table results">
          <thead>
            <tr>
              <th>発注先名</th><th>コード</th><th>ファミリ</th><th>評価</th>
              <th class="num">今期利用回数</th><th class="num">今期利用金額</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel detail-panel" id="detail" aria-live="polite">
      <p class="placeholder">検索結果から発注先を選択してください。</p>
    </section>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
